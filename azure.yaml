# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: ai-gateway-litellm
metadata:
  template: ai-gateway-litellm
requiredVersions:
  azd: '>=1.35.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'
services:
  ai-tutor-hosted-agent:
    host: azure.ai.agent
    project: agents/ai-tutor-hosted-agent
    language: python
    kind: hosted
    name: ai-tutor-hosted-agent
    description: An independent Python AI tutor using Microsoft Agent Framework and the LiteLLM gateway.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      LITELLM_BASE_URL: ${LITELLM_ENDPOINT}/v1
      AZURE_KEY_VAULT_NAME: ${AZURE_KEY_VAULT_NAME}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      OTEL_SERVICE_NAME: ai-tutor-hosted-agent
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
    hooks:
      postdeploy:
        shell: sh
        dir: ../..
        run: |
          set -eu
          principal="$(az rest --method get \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource https://ai.azure.com \
            --url "$CONSUMER_FOUNDRY_PROJECT_ENDPOINT/agents/ai-tutor-hosted-agent?api-version=v1" \
            --query versions.latest.instance_identity.principal_id --output tsv)"
          az deployment group create \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name hosted-agent-access \
            --template-file infra/modules/hosted-agent.bicep \
            --parameters agentPrincipalId="$principal" \
              keyVaultName="$AZURE_KEY_VAULT_NAME" \
              appInsightsName="$APPLICATIONINSIGHTS_NAME" \
            --output none
hooks:
  postprovision:
    shell: sh
    run: node scripts/deploy-prompt-agent.mjs
  postdeploy:
    shell: sh
    run: node scripts/deploy-prompt-agent.mjs
infra:
  provider: bicep
  path: infra
  module: main
